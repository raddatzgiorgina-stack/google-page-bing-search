<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Google 主页 + 必应搜索</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Google 主页 + 必应搜索</h1>
      <p class="sub">谷歌页面照旧，搜索走必应</p>
    </header>

    <section class="row">
      <div class="row-text">
        <span class="label">搜索转必应</span>
        <span class="desc" id="status">已启用</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </section>

    <section class="row column">
      <span class="label">新标签页 / 主页</span>
      <select id="newtabMode">
        <option value="real">真实谷歌首页（google.com）</option>
        <option value="local">本地仿谷歌页面</option>
      </select>
      <span class="desc">
        选“本地仿谷歌页面”后，即使无法访问 google.com 也能用（界面仿谷歌，搜索仍走必应）。
      </span>
    </section>

    <section class="actions">
      <button id="test" type="button">测试一次搜索</button>
    </section>

    <footer>
      规则：google.*/search?q=… → bing.com/search?q=…（图片搜索 → bing.com/images）
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
